name: Web Release (itch.io)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - simulation/inno_setup_script.iss

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build WebGL and push to itch.io
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Get version from Inno Setup script
        id: get_version
        shell: bash
        run: |
          v=$(grep -oP '#define MyAppVersion "\K[^"]+' simulation/inno_setup_script.iss)
          if [ -z "$v" ]; then echo "Could not find MyAppVersion"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Unity Library folder
        uses: actions/cache@v5
        with:
          path: simulation/Library
          key: Library-WebGL-${{ hashFiles('simulation/Assets/**', 'simulation/Packages/**', 'simulation/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Bake SUMO traffic into StreamingAssets before the build. eclipse-sumo is
      # pinned to the version the scenarios were authored with so bakes are stable.
      - name: Bake SUMO traffic recordings
        working-directory: simulation/python
        run: |
          python -m venv "$RUNNER_TEMP/sumo-venv"
          "$RUNNER_TEMP/sumo-venv/bin/pip" install --quiet eclipse-sumo==1.22.0 traci==1.22.0
          "$RUNNER_TEMP/sumo-venv/bin/python" record_scenario.py --all

      - name: Build Unity project (WebGL)
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: simulation
          targetPlatform: WebGL
          buildProfile: 'Assets/Settings/Build Profiles/Web - Desktop - Release.asset'
          buildsPath: simulation/build
          buildName: web
          versioning: Custom
          version: ${{ steps.get_version.outputs.version }}
          allowDirtyBuild: true

      # Verify where index.html landed. butler must push the folder that
      # contains index.html, Build/, and TemplateData/.
      - name: Show build output
        run: ls -R simulation/build/WebGL

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push simulation/build/WebGL/web j03e/downtown-driving:html \
            --userversion "${{ steps.get_version.outputs.version }}"
