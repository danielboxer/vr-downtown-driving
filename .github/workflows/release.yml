name: Release

on:
  push:
    branches:
      - main
    paths:
      - simulation/inno_setup_script.iss
  workflow_dispatch:

concurrency:
  # don't cancel mid-publish: a half-cancelled run can create the github release or
  # push one itch channel without the other.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Build WebGL and push to itch.io
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-tags: true # the itch-push skip check needs tags, not full history

      - name: Get version from Inno Setup script
        id: get_version
        shell: bash
        run: |
          v=$(grep -oP '#define MyAppVersion "\K[^"]+' simulation/inno_setup_script.iss)
          if [ -z "$v" ]; then echo "Could not find MyAppVersion"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Skip itch push if version tag already exists
        id: skip_check
        shell: bash
        run: |
          tag="v${{ steps.get_version.outputs.version }}"
          if [ -n "$(git tag -l "$tag")" ]; then
            echo "Tag $tag already exists - version was not bumped. Skipping itch push."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Unity Library folder
        uses: actions/cache@v5
        with:
          path: simulation/Library
          key: Library-WebGL-${{ hashFiles('simulation/Assets/**', 'simulation/Packages/**', 'simulation/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      # Bake SUMO traffic into StreamingAssets before the build. eclipse-sumo is
      # pinned to the version the scenarios were authored with so bakes are stable.
      # --no-project: record_scenario only needs traci/sumo, not the project's deps.
      - name: Bake SUMO traffic recordings
        working-directory: simulation/python
        run: uv run --no-project --python 3.12 --with eclipse-sumo==1.22.0 --with traci==1.22.0 record_scenario.py --all

      - name: Build Unity project (WebGL)
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: simulation
          targetPlatform: WebGL
          buildProfile: 'Assets/Settings/Build Profiles/Web - Desktop - Release.asset'
          buildsPath: simulation/build
          buildName: web
          versioning: Custom
          version: ${{ steps.get_version.outputs.version }}
          allowDirtyBuild: true

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      # push the folder that contains index.html, Build/, and TemplateData/.
      - name: Push to itch.io
        if: steps.skip_check.outputs.skip != 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push simulation/build/WebGL/web j03e/downtown-driving:html \
            --userversion "${{ steps.get_version.outputs.version }}"

  windows:
    name: Build Windows installer, release, push to itch.io
    # windows-2022 is required: the project uses IL2CPP
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write # required for OIDC token used by attest-build-provenance
      attestations: write # required to write attestation to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-tags: true # the skip-if-tag-exists check needs tags, not full history

      - name: Get version from Inno Setup script
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content simulation\inno_setup_script.iss -Raw
          if ($content -match '#define MyAppVersion "([^"]+)"') {
            "version=$($matches[1])" >> $env:GITHUB_OUTPUT
            "tag=v$($matches[1])" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not find MyAppVersion in inno_setup_script.iss"
            exit 1
          }

      - name: Skip if version tag already exists
        id: skip_check
        shell: pwsh
        run: |
          $tag = "${{ steps.get_version.outputs.tag }}"
          if (git tag -l $tag) {
            Write-Host "Tag $tag already exists - version was not bumped. Skipping release."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Cache Unity Library folder
        uses: actions/cache@v5
        with:
          path: simulation/Library
          key: Library-Win64-${{ hashFiles('simulation/Assets/**', 'simulation/Packages/**', 'simulation/ProjectSettings/**') }}
          restore-keys: |
            Library-Win64-
            Library-

      - name: Cache SUMO installer
        uses: actions/cache@v5
        with:
          path: simulation/build/sumo-win64-1.22.0.msi
          key: sumo-1.22.0

      # github windows runners intermittently boot with the Docker Engine service
      # stopped, which kills the containerized il2cpp build before unity starts.
      # see actions/runner-images#13729. start it and wait until it responds.
      - name: Ensure Docker Engine is running
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline) {
            if ((Get-Service docker).Status -ne 'Running') {
              Start-Service docker -ErrorAction SilentlyContinue
            }
            docker info *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Docker Engine is ready."
              exit 0
            }
            Start-Sleep -Seconds 5
          }
          Write-Error "Docker Engine did not become ready in time."
          exit 1

      - name: Build Unity project (StandaloneWindows64 / IL2CPP)
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: simulation
          targetPlatform: StandaloneWindows64
          # buildPath = buildsPath/targetPlatform (not buildName), so output goes to
          # simulation/build/StandaloneWindows64/, matching inno_setup_script.iss.
          buildsPath: simulation/build
          buildName: VR Downtown Driving
          versioning: Custom
          version: ${{ steps.get_version.outputs.version }}
          allowDirtyBuild: true

      # ── ScenarioManager.exe + Inno Setup installer ──────────────────────────

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          working-directory: simulation/python

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer (PyInstaller + Inno Setup)
        working-directory: simulation
        shell: pwsh
        run: .\build-installer.ps1

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "simulation\build\installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer .exe found in simulation\build\installer"
            exit 1
          }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      # ── GitHub Release ───────────────────────────────────────────────────────

      - name: Attest installer provenance
        if: steps.skip_check.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.installer.outputs.path }}

      - name: Create GitHub Release
        if: steps.skip_check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release create "${{ steps.get_version.outputs.tag }}" "${{ steps.installer.outputs.path }}" --title "${{ steps.get_version.outputs.tag }}"

      # ── itch.io ──────────────────────────────────────────────────────────────

      - name: Install butler
        shell: pwsh
        run: |
          curl.exe -L -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          Expand-Archive butler.zip -DestinationPath butler-bin -Force
          ./butler-bin/butler.exe -V

      - name: Push Windows installer to itch.io
        if: steps.skip_check.outputs.skip != 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        shell: pwsh
        run: |
          ./butler-bin/butler.exe push "${{ steps.installer.outputs.path }}" j03e/downtown-driving:windows `
            --userversion "${{ steps.get_version.outputs.version }}"
